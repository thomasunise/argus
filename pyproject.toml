[project]
name = "argus"
version = "1.0.0"
description = "Argus — Governed Defensive & Autonomous Security Platform"
readme = "README.md"
requires-python = ">=3.12"

[tool.ruff]
target-version = "py312"
line-length = 140
src = ["app", "tests", "sandbox"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "C90"]
ignore = ["E501", "S101", "B008"]

[tool.ruff.lint.mccabe]
max-complexity = 18

[tool.ruff.format]
quote-style = "single"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = false
check_untyped_defs = true
ignore_missing_imports = true
exclude = ["alembic/versions/.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore::DeprecationWarning:starlette.testclient",
]

[tool.coverage.run]
source = ["app"]
branch = true
omit = ["app/static/*"]

[tool.coverage.report]
show_missing = true
skip_empty = true
fail_under = 80
