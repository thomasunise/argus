{{- if not .Values.existingSecret }}
{{- if or (not .Values.secrets.sessionSecret) (not .Values.secrets.adminPassword) }}
{{- fail "Set secrets.sessionSecret and secrets.adminPassword (or existingSecret) before installing" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sentinel.fullname" . }}
  labels:
    {{- include "sentinel.labels" . | nindent 4 }}
type: Opaque
stringData:
  SESSION_SECRET: {{ .Values.secrets.sessionSecret | quote }}
  ADMIN_PASSWORD: {{ .Values.secrets.adminPassword | quote }}
  INGEST_API_KEY: {{ .Values.secrets.ingestApiKey | quote }}
  AUDIT_SIGNING_KEY: {{ .Values.secrets.auditSigningKey | quote }}
  DATABASE_URL: {{ .Values.secrets.databaseUrl | quote }}
  REDIS_URL: {{ .Values.secrets.redisUrl | quote }}
  {{- with .Values.secrets.oidcClientSecret }}
  OIDC_CLIENT_SECRET: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.anthropicApiKey }}
  ANTHROPIC_API_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.openaiApiKey }}
  OPENAI_API_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.zapApiKey }}
  ZAP_API_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.calderaApiKey }}
  CALDERA_API_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.auditAzureConnectionString }}
  AUDIT_AZURE_CONNECTION_STRING: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.wazuhIndexerPassword }}
  WAZUH_INDEXER_PASSWORD: {{ . | quote }}
  {{- end }}
{{- end }}
