{{- if .Values.sandbox.enabled }}
# ---------------------------------------------------------------- sandbox executor
# The executor is the only workload with a cluster credential. It is bound to one namespace and
# can only create jobs, pods/log reads, configmaps and network policies there. Argus reaches it
# over the cluster network; the script never runs in the API or worker pod.
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.sandbox.namespace }}
  labels:
    {{- include "argus.labels" . | nindent 4 }}
    app.kubernetes.io/component: sandbox
---
{{- if not .Values.sandbox.executor.existingTokenSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "argus.fullname" . }}-sandbox-executor
  labels:
    {{- include "argus.labels" . | nindent 4 }}
    app.kubernetes.io/component: sandbox
type: Opaque
stringData:
  EXECUTOR_TOKEN: {{ required "sandbox.executor.token (or sandbox.executor.existingTokenSecret) is required when sandbox.enabled" .Values.sandbox.executor.token | quote }}
{{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "argus.fullname" . }}-sandbox-executor
  labels:
    {{- include "argus.labels" . | nindent 4 }}
    app.kubernetes.io/component: sandbox
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "argus.fullname" . }}-sandbox-executor
  namespace: {{ .Values.sandbox.namespace }}
  labels:
    {{- include "argus.labels" . | nindent 4 }}
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create", "get", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["create", "get", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "argus.fullname" . }}-sandbox-executor
  namespace: {{ .Values.sandbox.namespace }}
  labels:
    {{- include "argus.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "argus.fullname" . }}-sandbox-executor
subjects:
  - kind: ServiceAccount
    name: {{ include "argus.fullname" . }}-sandbox-executor
    namespace: {{ .Release.Namespace }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "argus.fullname" . }}-sandbox-executor
  labels:
    {{- include "argus.labels" . | nindent 4 }}
    app.kubernetes.io/component: sandbox
spec:
  replicas: {{ .Values.sandbox.executor.replicas }}
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      {{- include "argus.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: sandbox-executor
  template:
    metadata:
      labels:
        {{- include "argus.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: sandbox-executor
    spec:
      serviceAccountName: {{ include "argus.fullname" . }}-sandbox-executor
      automountServiceAccountToken: true   # the executor needs an in-cluster token to create jobs
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: executor
          image: "{{ .Values.sandbox.executor.image }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: SANDBOX_NAMESPACE
              value: {{ .Values.sandbox.namespace | quote }}
            - name: SANDBOX_RUNTIME_CLASS
              value: {{ .Values.sandbox.runtimeClassName | quote }}
            - name: EXECUTOR_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ default (printf "%s-sandbox-executor" (include "argus.fullname" .)) .Values.sandbox.executor.existingTokenSecret }}
                  key: {{ .Values.sandbox.executor.existingTokenSecretKey }}
            - name: SANDBOX_ENGINE_IMAGES
              value: {{ .Values.sandbox.engineImages | quote }}
            - name: SANDBOX_ENGINE_MAX_WALL_SECONDS
              value: {{ .Values.sandbox.engineMaxWallSeconds | quote }}
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 20
          resources:
            {{- toYaml .Values.sandbox.executor.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "argus.fullname" . }}-sandbox-executor
  labels:
    {{- include "argus.labels" . | nindent 4 }}
    app.kubernetes.io/component: sandbox
spec:
  type: ClusterIP
  selector:
    {{- include "argus.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: sandbox-executor
  ports:
    - name: http
      port: 8080
      targetPort: http
{{- end }}
