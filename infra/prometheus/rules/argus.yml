# Alerting rules. Thresholds are starting points for a pilot; tune per deployment.
groups:
  - name: argus
    rules:
      - alert: ArgusApiDown
        expr: up{job="argus-api"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Argus API is not being scraped"
          runbook: "docs/RUNBOOKS.md#api-unavailable"

      - alert: ArgusHigh5xxRate
        expr: |
          sum(rate(argus_http_requests_total{status=~"5.."}[5m]))
            / clamp_min(sum(rate(argus_http_requests_total[5m])), 0.001) > 0.05
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "More than 5% of HTTP requests are failing"

      - alert: ArgusSlowRequests
        expr: histogram_quantile(0.95, sum by (le) (rate(argus_http_request_seconds_bucket[5m]))) > 2
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "p95 HTTP latency above 2s"

      - alert: ArgusJobsFailing
        expr: sum(increase(argus_jobs_total{status="failed"}[15m])) > 5
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Queue jobs are failing"
          runbook: "docs/RUNBOOKS.md#lost-worker"

      - alert: ArgusNoJobsCompleting
        expr: sum(increase(argus_jobs_total{status="completed"}[30m])) == 0 and sum(increase(argus_jobs_total{status="queued"}[30m])) > 0
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Jobs are queued but none complete: worker lost or Redis down"
          runbook: "docs/RUNBOOKS.md#lost-worker"

      - alert: ArgusActionsFailing
        expr: sum(increase(argus_actions_total{status=~"failed|rolled_back"}[1h])) > 0
        labels:
          severity: warning
        annotations:
          summary: "An action execution failed or was rolled back in the last hour"
          runbook: "docs/RUNBOOKS.md#rolling-back-an-action"

      - alert: ArgusCanaryTripped
        expr: sum(increase(argus_detections_total{rule="canary.tripwire"}[10m])) > 0
        labels:
          severity: critical
        annotations:
          summary: "A canary was used"
          runbook: "docs/RUNBOOKS.md#handling-a-canary-hit"

      - alert: ArgusCriticalFindingsOpen
        expr: sum(argus_findings_open{severity="critical"}) > 0
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "Critical findings have been open for more than an hour"

      - alert: ArgusDroppedEvents
        expr: sum(increase(argus_ingest_events_total{status="dropped"}[10m])) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Security events were dropped or rejected during ingestion"

      - alert: ArgusQueueDelayHigh
        expr: histogram_quantile(0.95, sum by (le) (rate(argus_queue_delay_seconds_bucket[5m]))) > 30
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "p95 queue wait delay exceeds 30s"

      - alert: ArgusCollectorFailures
        expr: sum(increase(argus_collector_runs_total{status="failed"}[30m])) > 2
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Posture or cloud collectors are failing repeatedly"

      - alert: ArgusRollbackFailed
        expr: sum(increase(argus_actions_total{status="rollback_failed"}[1h])) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "An automated or manual action rollback failed"
          runbook: "docs/RUNBOOKS.md#rolling-back-an-action"
