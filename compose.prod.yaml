# Production-shaped overlay: TLS termination with Caddy, restart policies, JSON logs, and
# no host port on the API (Caddy reaches it on the internal network).
#
#   docker compose -f compose.yaml -f compose.prod.yaml up -d
#
# Required in .env for this overlay:
#   ARGUS_DOMAIN=<host>          public hostname; also becomes BASE_URL=https://<host> (Caddy obtains a certificate via ACME)
#   ACME_EMAIL=<ops@example.com>    ACME account contact; Caddy fails to parse its config when empty
#   SESSION_SECRET / ADMIN_PASSWORD / INGEST_API_KEY / DATA_ENCRYPTION_KEY / AUDIT_SIGNING_KEY   (python scripts/generate_secrets.py --write)
# Set by this overlay for api AND worker (assert_safe_config enforces them in production):
#   APP_ENV=production   COOKIE_SECURE=true   LOG_JSON=true   BASE_URL=https://${ARGUS_DOMAIN}   TOTP_REQUIRED=true
# Optional in .env:
#   TOTP_REQUIRED=false             only together with OIDC_ISSUER / OIDC_CLIENT_ID / OIDC_CLIENT_SECRET (single sign-on)
#   AUDIT_S3_BUCKET / AUDIT_AZURE_CONTAINER   object-lock mirror; needs the `<tag>-extras` image (boto3 / azure-storage-blob).
#   AUDIT_JSONL_PATH is set by compose.yaml.
# Pin ARGUS_IMAGE to a signed, digest-pinned release (see .github/workflows/release.yml).

# Production settings shared by every Argus process; both api and worker call
# assert_safe_config at startup, so the worker needs the full set too.
x-production-env: &production-env
  APP_ENV: production
  COOKIE_SECURE: "true"
  LOG_JSON: "true"
  BASE_URL: https://${ARGUS_DOMAIN:?set ARGUS_DOMAIN}
  TOTP_REQUIRED: ${TOTP_REQUIRED:-true}   # OIDC deployments set TOTP_REQUIRED=false in .env together with OIDC_ISSUER
  BACKUP_ENABLED: ${BACKUP_ENABLED:-true}     # daily encrypted backups into the argus-data volume (docs/BACKUP.md); add BACKUP_S3_BUCKET for off-host copies
  RETENTION_ENABLED: ${RETENTION_ENABLED:-true}

services:
  api:
    # The loopback bind 127.0.0.1:8080 from compose.yaml stays for host-local operations
    # (SSH tunnel, scripts). Caddy is the only network-reachable ingress.
    environment:
      <<: *production-env
      FORWARDED_ALLOW_IPS: "*"   # only Caddy can reach the API on the internal network
    restart: always
    logging: &json-logging
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  worker:
    environment:
      <<: *production-env
    restart: always
    logging: *json-logging

  postgres:
    restart: always
    logging: *json-logging

  redis:
    restart: always
    logging: *json-logging

  caddy:
    image: caddy:2.8-alpine
    restart: always
    environment:
      ARGUS_DOMAIN: ${ARGUS_DOMAIN:?set ARGUS_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL}   # Caddyfile `email {$ACME_EMAIL}` does not parse when empty
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    logging: *json-logging
    networks:
      - argus

volumes:
  caddy-data:
  caddy-config:
