<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Sentinel — Security Operations</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/static/styles.css">
<script src="/static/theme.js"></script>
</head><body>
<div id="login" class="login-overlay hidden">
  <div class="login-card" id="login-card"></div>
</div>
<div class="app-shell hidden" id="shell">
  <aside class="sidebar" id="sidebar">
    <div class="brand"><div class="brand-text">Sentinel <small>Security operations</small></div></div>
    <div id="tenant-switch" class="tenant-switch hidden"></div>
    <div id="navigation" class="nav-scroll"></div>
    <div class="sidebar-bottom">
      <div class="agent-mini"><span class="status-led" id="side-led"></span><strong>API</strong><small id="side-health">Connecting…</small></div>
      <div class="sidebar-separator"></div>
      <div class="profile-row" id="profile-row"><div><strong id="profile-name">—</strong><small id="profile-role">—</small></div><button id="user-menu-btn" class="icon-btn" aria-haspopup="menu" aria-expanded="false">Account</button></div>
      <div id="user-menu" class="user-menu hidden" role="menu"></div>
    </div>
  </aside>
  <div class="workspace">
    <div id="kill-banner" class="kill-banner hidden" role="alert"></div>
    <header class="topbar">
      <div class="top-left"><button class="menu-toggle" id="menu-toggle" aria-label="Toggle navigation">☰</button><span class="top-section" id="breadcrumb">Security / <strong>Overview</strong></span></div>
      <div class="top-actions"><div class="environment-pill"><span class="status-led"></span> <span id="tenant-pill">Connected</span></div><span class="top-divider"></span><button class="btn subtle top-btn" id="refresh"><span>Refresh</span></button><button class="btn subtle" id="theme-toggle" aria-label="Toggle dark mode">Dark</button><div class="date-display" id="display-date"></div></div>
    </header>
    <main id="main" class="main-content"><div class="loading">Loading…</div></main>
  </div>
</div>
<div class="overlay-backdrop drawer-backdrop hidden" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-heading"><aside class="overlay-panel"><div class="overlay-head"><h2 id="drawer-heading">Details</h2><button class="close-btn" data-close="drawer" aria-label="Close">×</button></div><div class="overlay-body"></div></aside></div>
<div class="overlay-backdrop modal-backdrop hidden" id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-heading"><div class="overlay-panel"><div class="overlay-head"><h2 id="modal-heading">Details</h2><button class="close-btn" data-close="modal" aria-label="Close">×</button></div><div class="overlay-body"></div></div></div>
<div id="toast-area" class="toast-area" role="status" aria-live="polite"></div>
<script type="module" src="/static/app.js"></script>
</body></html>
