<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Sentinel — Security Operations</title>
<link rel="stylesheet" href="/static/styles.css">
<script>try{var t=localStorage.getItem('sentinel-theme');if(t==='dark')document.documentElement.dataset.theme='dark';}catch(e){}</script>
</head><body>
<div id="login" class="login-overlay hidden">
  <div class="login-card">
    <h1>Sentinel</h1>
    <p>Security operations</p>
    <form id="login-form">
      <label class="field-label" for="password">Administrator password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button type="submit" class="btn primary full">Sign in</button>
      <div id="login-error" class="login-error"></div>
    </form>
    <div class="login-foot"><span class="status-led"></span> Self-hosted · Restricted access</div>
  </div>
</div>
<div class="app-shell" id="shell">
  <aside class="sidebar" id="sidebar">
    <div class="brand"><div class="brand-text">Sentinel <small>Security operations</small></div></div>
    <div class="nav-group-title">Workspace</div>
    <nav id="navigation">
      <button class="nav-item active" data-page="overview">Overview</button>
      <button class="nav-item" data-page="assets">Asset inventory</button>
      <button class="nav-item" data-page="findings">Findings <span class="nav-count" id="findings-count">0</span></button>
      <button class="nav-item" data-page="scans">Scan operations</button>
      <button class="nav-item" data-page="investigations">AI investigations</button>
      <button class="nav-item" data-page="activity">Event activity</button>
    </nav>
    <div class="nav-group-title group-gap">Administration</div>
    <nav>
      <button class="nav-item" data-page="approvals">Approvals <span class="nav-count" id="approvals-count">0</span></button>
      <button class="nav-item" data-page="integrations">Integrations</button>
      <button class="nav-item" data-page="settings">Configuration</button>
    </nav>
    <div class="sidebar-bottom">
      <div class="agent-mini"><span class="status-led"></span><strong>API</strong><small id="side-health">Connecting…</small></div>
      <div class="sidebar-separator"></div>
      <div class="profile-row"><div><strong>Administrator</strong><small>Local operator</small></div><button id="logout" class="icon-btn" title="Sign out">Sign out</button></div>
    </div>
  </aside>
  <div class="workspace">
    <header class="topbar">
      <div class="top-left"><button class="menu-toggle" id="menu-toggle" aria-label="Toggle navigation">☰</button><span class="top-section">Security / <strong id="breadcrumb">Overview</strong></span></div>
      <div class="top-actions"><div class="environment-pill"><span class="status-led"></span> Connected</div><span class="top-divider"></span><button class="btn subtle top-btn" id="refresh"><span>Refresh</span></button><button class="btn subtle" id="theme-toggle" aria-label="Toggle dark mode">Dark</button><div class="date-display" id="display-date"></div></div>
    </header>
    <main id="main" class="main-content"><div class="loading">Loading…</div></main>
  </div>
</div>
<div class="modal-backdrop hidden" id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-heading"><div class="modal-panel"><div class="modal-head"><h2 id="modal-heading">Details</h2><button id="modal-close" class="close-btn" aria-label="Close">×</button></div><div id="modal-body"></div></div></div>
<div id="toast-area" class="toast-area" role="status" aria-live="polite"></div>
<script src="/static/app.js" defer></script>
</body></html>
