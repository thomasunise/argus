version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      runtime:
        patterns: ["fastapi", "uvicorn", "sqlalchemy", "alembic", "psycopg", "pydantic*", "httpx", "redis", "PyJWT", "prometheus-client", "PyYAML", "itsdangerous", "python-dotenv"]
      model-providers:
        patterns: ["anthropic", "openai"]
      test:
        patterns: ["pytest*", "respx"]
      cloud-sdks:
        patterns: ["boto3", "azure-*", "google-*", "kubernetes"]
      opentelemetry:
        patterns: ["opentelemetry-*"]
    labels: ["dependencies", "python"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    labels: ["dependencies", "ci"]

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    labels: ["dependencies", "docker"]

  - package-ecosystem: terraform
    directory: "/infra/terraform"
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    labels: ["dependencies", "terraform"]

  - package-ecosystem: terraform
    directory: "/infra/terraform-azure"
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    labels: ["dependencies", "terraform"]
