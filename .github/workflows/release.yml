name: Release

# On a version tag: build the image, push to GHCR with the tag and the digest, attach an
# SPDX SBOM (syft), sign image and SBOM with cosign (keyless, GitHub OIDC), and publish a
# GitHub release with the SBOM and provenance attached.
#
# Verify a published image:
#   cosign verify ghcr.io/<owner>/argus:<tag> \
#     --certificate-identity-regexp 'https://github.com/<owner>/argus/.github/workflows/release.yml@refs/tags/.*' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/argus

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long
          labels: |
            org.opencontainers.image.title=Argus
            org.opencontainers.image.licenses=MIT

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ github.ref_name }}
          provenance: mode=max
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build extras image (cloud SDKs + OpenTelemetry)
        id: build_extras
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ env.IMAGE }}:${{ github.ref_name }}-extras
          build-args: |
            APP_VERSION=${{ github.ref_name }}
            EXTRAS=1
          provenance: mode=max
          sbom: false
          cache-from: type=gha

      - name: Generate SBOM (syft, SPDX JSON)
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: true
          upload-release-assets: false

      - uses: sigstore/cosign-installer@v3

      - name: Sign image (keyless)
        env:
          COSIGN_YES: "true"
        run: |
          cosign sign --recursive "${IMAGE}@${{ steps.build.outputs.digest }}"
          cosign sign --recursive "${IMAGE}@${{ steps.build_extras.outputs.digest }}"

      - name: Attach and sign SBOM attestation
        env:
          COSIGN_YES: "true"
        run: |
          cosign attest --type spdxjson --predicate sbom.spdx.json "${IMAGE}@${{ steps.build.outputs.digest }}"

      - name: GitHub build provenance attestation
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Write release notes
        run: |
          {
            echo "## Argus ${{ github.ref_name }}"
            echo
            echo "Image: \`${IMAGE}@${{ steps.build.outputs.digest }}\`"
            echo "Extras image: \`${IMAGE}@${{ steps.build_extras.outputs.digest }}\`"
            echo
            echo "Verify:"
            echo '```'
            echo "cosign verify ${IMAGE}:${{ github.ref_name }} \\"
            echo "  --certificate-identity-regexp 'https://github.com/${{ github.repository }}/.github/workflows/release.yml@refs/tags/.*' \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com"
            echo '```'
          } > release-notes.md

      - uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: |
            sbom.spdx.json
          generate_release_notes: true
